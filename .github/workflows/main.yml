name: zVPN24 & zProxy24 Auto Fetcher

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Cache Databases
        uses: actions/cache@v3
        with:
          path: |
            history.txt
            GeoLite2-Country.mmdb
            GeoLite2-ASN.mmdb
          key: vpn-data-${{ github.run_id }}
          restore-keys: |
            vpn-data-

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyTelegramBotAPI maxminddb

      - name: Run Main Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PYTHONUNBUFFERED: "1" 
        run: python main.py
