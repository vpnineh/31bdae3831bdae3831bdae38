name: zVPN24 & zProxy24 Auto Fetcher

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '7,22,37,52 * * * *'

# ==========================================
# بخش جدید: جلوگیری از اجرای همزمان و تداخل
# ==========================================
concurrency:
  group: auto-scraper
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 

      - name: Cache Offline GeoDBs
        uses: actions/cache@v3
        with:
          path: |
            GeoLite2-Country.mmdb
            GeoLite2-ASN.mmdb
          key: geodb-${{ github.run_id }}
          restore-keys: |
            geodb-

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyTelegramBotAPI maxminddb beautifulsoup4 geoip2

      - name: Run Main Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PYTHONUNBUFFERED: "1" 
        run: python main.py

      - name: Commit and Push history.txt
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add history.txt
          # اضافه شدن git pull --rebase برای حل مشکل تداخل سرور
          git diff --quiet && git diff --staged --quiet || (git commit -m "📝 Auto-update history database [skip ci]" && git pull --rebase origin main && git push)
